<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Documento base -->
  <rect x="40" y="20" width="100" height="130" rx="8" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <!-- Dobra do canto superior direito -->
  <path d="M115 20 L140 45 L115 45 Z" fill="#BFDBFE" stroke="#2563EB" stroke-width="2"/>
  <path d="M115 20 L140 45 H115 V20Z" fill="#DBEAFE"/>
  <!-- Linhas do documento -->
  <line x1="58" y1="70" x2="122" y2="70" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="85" x2="122" y2="85" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  <line x1="58" y1="100" x2="100" y2="100" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>
  <!-- Linha de assinatura -->
  <line x1="58" y1="128" x2="122" y2="128" stroke="#2563EB" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Assinatura manuscrita -->
  <path d="M62 122 Q68 114 74 120 Q80 126 86 118 Q90 113 96 119 Q101 124 106 118"
        stroke="#1D4ED8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Caneta -->
  <g transform="rotate(-35, 140, 140)">
    <rect x="128" y="118" width="10" height="34" rx="2" fill="#2563EB"/>
    <polygon points="128,152 138,152 133,165" fill="#1E40AF"/>
    <rect x="128" y="118" width="10" height="8" rx="2" fill="#1E40AF"/>
    <line x1="133" y1="126" x2="133" y2="152" stroke="#3B82F6" stroke-width="1.5"/>
  </g>
  <!-- Selo de verificado -->
  <circle cx="148" cy="158" r="18" fill="#10B981"/>
  <path d="M139 158 L145 164 L157 152" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>